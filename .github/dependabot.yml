version: 2
updates:
  # Fetch and update latest `npm` packages
  - package-ecosystem: npm
    directory: "/"
    target-branch: "main"
    labels:
      - "Technical Dept"
    schedule:
      interval: weekly
      time: "05:00"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      npm-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
  # Fetch and update latest `github-actions` packages
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "05:00"
    target-branch: "main"
    labels:
      - "Technical Dept"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      github-actions-all:
        patterns:
          - "*"
