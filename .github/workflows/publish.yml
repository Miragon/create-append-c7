name: Publish

# Real publishes are only called by release-please.yml so npm Trusted
# Publishing can validate the top-level workflow. Manual runs are always dry
# runs; retry a failed real publish by re-running its original publish job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to validate (for example, v0.2.0). Empty uses the selected branch.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to check out and publish (for example, v0.2.0).'
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) to mint a provenance token.
      id-token: write
    env:
      EFFECTIVE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Yarn via Corepack
        run: corepack enable

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node --print "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"

          if [[ -z "$RELEASE_TAG" && "$EFFECTIVE_DRY_RUN" != 'true' ]]; then
            echo 'A release tag is required for a real publish.' >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install browser for publish checks
        run: yarn playwright install --with-deps chromium

      # Yarn runs browser tests in prepublish and builds in prepack.
      - name: Publish (dry run)
        if: env.EFFECTIVE_DRY_RUN == 'true'
        run: yarn npm publish --access public --dry-run

      - name: Publish to npm
        if: env.EFFECTIVE_DRY_RUN == 'false'
        run: yarn npm publish --access public --provenance --tolerate-republish
