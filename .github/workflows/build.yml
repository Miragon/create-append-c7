name: Build

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      # Pack sanity check: fails the build if the published payload would be
      # malformed (e.g. missing dist/ from a broken tsc step).
      - run: npm publish --access public --dry-run
