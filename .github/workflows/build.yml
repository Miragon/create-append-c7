name: Build

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Lint (TypeScript)
        run: ./node_modules/.bin/tsc -p tsconfig.lib.json --noEmit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Audit
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Pack sanity check: fails the build if the published payload would be
      # malformed (e.g. missing dist/ from a broken tsc step).
      - run: npm publish --access public --dry-run

  ci:
    if: always()
    needs:
      - lint
      - audit
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            to_entries | all(.value.result == "success")
          '
