name: Build

on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Yarn via Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint (TypeScript)
        run: yarn tsc -p tsconfig.lib.json --noEmit

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Yarn via Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Audit
        run: yarn npm audit --all --recursive --severity high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable Yarn via Corepack
        run: corepack enable
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      # Yarn runs browser tests in prepublish and builds in prepack.
      # Validate the package without uploading it to the registry.
      - run: yarn npm publish --access public --dry-run

  ci:
    if: always()
    needs:
      - lint
      - audit
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            to_entries | all(.value.result == "success")
          '
