name: Bug Report
description: Report a problem with @miragon/create-append-c7
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the smallest set of steps or provide a minimal repository that reproduces the problem.
      placeholder: |
        1. Configure the Camunda 7 modeler with ...
        2. Create an element from the template ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Package and Dependency Versions
      description: Include the versions of @miragon/create-append-c7, bpmn-js, bpmn-js-create-append-anything, and your element-templates package.
      placeholder: |
        @miragon/create-append-c7: 0.1.0
        bpmn-js: 18.16.1
        bpmn-js-create-append-anything: 1.2.0
        element-templates package: ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add relevant console output or stack traces. Please remove sensitive information.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, BPMN snippets, or element templates that may help.
    validations:
      required: false
